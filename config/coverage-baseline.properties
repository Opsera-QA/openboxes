# Aggregate JaCoCo coverage baseline for openboxes
#
# These figures are measured by running both the 'test' and 'integrationTest' Gradle
# tasks against a provisioned database, then executing 'jacocoAggregateReport'.
# The coverageRatchet task fails the build if either metric drops more than
# 'coverage.tolerance' percentage points below these values.
#
# To update after a legitimate coverage improvement:
#   1. Run:  TEST_DATABASE=mysql:8.0.36 ./gradlew jacocoAggregateReport
#   2. Read the instruction and branch percentages from the XML report at
#      build/reports/jacoco/aggregate/jacocoAggregateReport.xml
#   3. Replace the values below and add the measuring commit SHA in the comment.
#   4. Commit both the code change and this file in the same pull request.
#
# Measuring commit SHA: initial-baseline — update after first successful CI run
# Last updated: 2026-07-30

coverage.instruction=0.00
coverage.branch=0.00
coverage.tolerance=0.5
