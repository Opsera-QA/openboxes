name: Backend Tests

# Is only runnable via other workflows
on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        # If we're running tests for a PR from a fork, this will not be available.
        required: false

jobs:
  run-backend-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # If we start actively supporting other databases, they should be added here so that we can test against them.
        testdatabase: ["mysql:8.0.36", "mariadb:10.3.39"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: temurin
          cache: gradle

      # Run unit tests (src/test/groovy) and integration tests (src/integration-test/groovy)
      # as separate Gradle tasks so each tier writes its own .exec file under build/jacoco/.
      # The integration tier requires a database; Testcontainers provisions one from the
      # TEST_DATABASE image.  The dirty-database contract between integration specs is
      # intentional and must not be changed here.
      - name: Run Unit Tests
        run: ./gradlew test --no-daemon

      - name: Run Integration Tests
        run: TEST_DATABASE=${{ matrix.testdatabase }} ./gradlew integrationTest --no-daemon

      # Merge both .exec files into one aggregate XML + HTML report under
      # build/reports/jacoco/aggregate/.  The task fails with a clear message if
      # either exec file is missing or zero-byte (see gradle/coverage.gradle).
      - name: Generate Aggregate Coverage Report
        run: ./gradlew jacocoAggregateReport --no-daemon

      # Fail the build if instruction or branch coverage has regressed beyond the
      # tolerance committed in config/coverage-baseline.properties.
      # The ratchet writes a Markdown summary to build/jacoco/coverage-summary.md.
      - name: Verify Coverage Ratchet
        run: ./gradlew coverageRatchet --no-daemon

      # Append the coverage table to the GitHub job summary so reviewers can see
      # the figures without downloading the artifact.
      - name: Post coverage to job summary
        if: always()
        run: |
          if [ -f build/jacoco/coverage-summary.md ]; then
            cat build/jacoco/coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## JaCoCo Aggregate Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "_Coverage summary not generated (report may have failed)._" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Upload both XML and HTML so reviewers can browse the full report in CI.
      # Retained for 30 days; only upload once (from the first matrix job) to
      # avoid duplicate artifact names.
      - name: Upload coverage report artifact
        if: ${{ always() && strategy.job-index == 0 }}
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-aggregate-report
          path: build/reports/jacoco/aggregate/
          retention-days: 30
          if-no-files-found: warn

      # Tests are run for each database in the above matrix, but we only want to publish a code coverage report once.
      # "strategy.job-index" gives us the index of the current job in the matrix. Any index is fine. We use the first.
      # Additionally, because we're using pull_request instead of pull_request_target (for security purposes) when
      # running tests on PRs (see test-pull-request.yml), forks won't have access to GitHub secrets, so this step will
      # fail if we try to run it. As such, we have to skip publishing Codecov reports when running tests from forks.
      - name: Upload results to Codecov
        if: ${{ strategy.job-index == 0 && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/jacoco/aggregate/jacocoAggregateReport.xml
