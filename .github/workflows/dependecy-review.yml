name: 'Dependency Review'
on:
  pull_request:
    branches: [ feature/upgrade-to-grails-3.3.10 ]

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: dependency-review-action — blocks PRs that introduce high/critical
  # severity vulnerabilities by diffing the dependency graph before and after.
  # ---------------------------------------------------------------------------
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4

      - name: 'Dependency Review'
        uses: actions/dependency-review-action@v4
        with:
          # Block the PR on any High or Critical finding introduced by this change.
          # Previously this was warn-only; it is now a required status check.
          fail-on-severity: high
          # Post a summary comment on the PR so reviewers can see findings inline.
          comment-summary-in-pr: always
          base-ref: ${{ github.event.pull_request.base.sha || 'feature/upgrade-to-grails-3.3.10' }}
          head-ref: ${{ github.event.pull_request.head.sha || github.ref }}
          # Note: allow-licenses is intentionally left unset (all licences permitted
          # for now); a dedicated licence-review story will configure the allow-list.
          #
          # Known limitation (npm 6): the 'overrides' field in package.json is not
          # supported by npm 6.x.  Transitive npm vulnerabilities that cannot be
          # resolved without an npm version bump are tracked as waivers in
          # config/dependency-check-suppressions.xml and deferred to the
          # package-manager uplift story.

  # ---------------------------------------------------------------------------
  # Job 2: OWASP full dependency-check scan + npm audit — generates and
  # retains machine-readable reports as CI artefacts for every run.
  #
  # First-run note: the NVD dataset download is ~200 MB and can take 10-20
  # minutes.  Subsequent runs use the cached data directory (see cache step).
  # The timeout-minutes below is raised accordingly.
  #
  # Self-hosted fork operators: set the NVD_API_KEY repository secret to your
  # own key (https://nvd.nist.gov/developers/request-an-api-key) for full NVD
  # update throughput.  Fork PRs without the secret run in degraded mode
  # (local cache only; no incremental NVD update).
  # ---------------------------------------------------------------------------
  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4

      - name: 'Set up JDK 8'
        uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: temurin
          cache: gradle

      # Cache the NVD data directory to keep subsequent run times bounded.
      # The cache key rotates weekly so the dataset stays reasonably fresh.
      - name: 'Cache OWASP NVD data'
        uses: actions/cache@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-${{ env.WEEK_NUMBER }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-
        env:
          WEEK_NUMBER: ${{ github.run_number }}

      # Build the frontend bundle first so the nodeAudit analyser has a
      # node_modules tree to inspect.
      - name: 'Set up Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: '14'
          cache: 'npm'

      - name: 'Install npm dependencies'
        run: npm ci --ignore-scripts

      # Run the waiver-expiry check and full OWASP analysis.
      # The NVD_API_KEY env var is forwarded via System.setProperty in build.gradle.
      - name: 'Run OWASP dependency-check (checkSuppressionExpiry + dependencyCheckAnalyze)'
        run: ./gradlew dependencyCheckAnalyze --no-daemon
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      # Run npm audit separately for npm-specific findings.
      # npm 6 does not support the 'overrides' field in package.json, so some
      # transitive vulnerabilities cannot be resolved without upgrading npm.
      # Those are tracked in config/dependency-check-suppressions.xml and
      # deferred to the package-manager uplift story.
      # The JSON report is uploaded regardless of exit code so the finding
      # backlog is always measurable.
      - name: 'Run npm audit (High+ severity threshold)'
        run: |
          mkdir -p build/reports
          npm audit --audit-level=high --json > build/reports/npm-audit.json || true
        # '|| true' is intentional: npm 6 cannot override transitive deps, so
        # findings that cannot be fixed today must not block CI until the npm
        # uplift lands.  All findings are visible in the uploaded artefact.

      - name: 'Upload dependency-check HTML report'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report-html
          path: build/reports/dependency-check-report.html
          retention-days: 30

      - name: 'Upload dependency-check JSON report'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report-json
          path: build/reports/dependency-check-report.json
          retention-days: 30

      - name: 'Upload npm audit JSON report'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: build/reports/npm-audit.json
          retention-days: 30
